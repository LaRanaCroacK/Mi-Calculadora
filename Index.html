
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora Premium</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #111318;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  color: white;
}

.calculadora {
  width: 100%;
  max-width: 360px;
  background: #20232b;
  padding: 25px;
  border-radius: 25px;
  box-shadow: 0 15px 40px #0008;
}

.titulo {
  font-size: 15px;
  color: #a5a9b3;
  letter-spacing: 3px;
  margin-bottom: 25px;
}

#pantalla {
  width: 100%;
  height: 90px;
  background: transparent;
  border: none;
  color: white;
  font-size: 38px;
  text-align: right;
  outline: none;
  margin-bottom: 25px;
}

.botones {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

button {
  height: 65px;
  border: none;
  border-radius: 18px;
  background: #30343e;
  color: white;
  font-size: 23px;
  cursor: pointer;
  transition: 0.15s;
}

button:active {
  transform: scale(0.94);
  background: #454b58;
}

.operador {
  background: #e98b35;
  color: white;
}

.especial {
  background: #444a55;
  color: #ffad61;
}

.igual {
  background: #f39a45;
  color: white;
  grid-column: span 2;
}

.cero {
  grid-column: span 2;
}
</style>
</head>

<body>

<div class="calculadora">

  <div class="titulo">CALCULADORA</div>

  <input id="pantalla" readonly placeholder="0">

  <div class="botones">

    <button class="especial" onclick="limpiar()">AC</button>
    <button class="especial" onclick="borrar()">⌫</button>
    <button class="especial" onclick="agregar('%')">%</button>
    <button class="operador" onclick="agregar('/')">÷</button>

    <button onclick="agregar('7')">7</button>
    <button onclick="agregar('8')">8</button>
    <button onclick="agregar('9')">9</button>
    <button class="operador" onclick="agregar('*')">×</button>

    <button onclick="agregar('4')">4</button>
    <button onclick="agregar('5')">5</button>
    <button onclick="agregar('6')">6</button>
    <button class="operador" onclick="agregar('-')">−</button>

    <button onclick="agregar('1')">1</button>
    <button onclick="agregar('2')">2</button>
    <button onclick="agregar('3')">3</button>
    <button class="operador" onclick="agregar('+')">+</button>

    <button class="cero" onclick="agregar('0')">0</button>
    <button onclick="agregar('.')">.</button>
    <button class="igual" onclick="calcular()">=</button>

  </div>
</div>

<script>
const pantalla = document.getElementById("pantalla");

function agregar(valor) {
  pantalla.value += valor;
}

function limpiar() {
  pantalla.value = "";
}

function borrar() {
  pantalla.value = pantalla.value.slice(0, -1);
}

function calcular() {
  try {
    let expresion = pantalla.value.replace(/%/g, "/100");

    if (!/^[0-9+\-*/.() ]+$/.test(expresion)) {
      throw new Error();
    }

    let resultado = Function(
      '"use strict"; return (' + expresion + ')'
    )();

    pantalla.value = Number.isFinite(resultado)
      ? String(Number(resultado.toFixed(10)))
      : "Error";

  } catch {
    pantalla.value = "Error";
  }
}
</script>

</body>
</html>
